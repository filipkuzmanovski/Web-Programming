<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chefs</title>
</head>
<body>
<h1>Welcome to Our Restaurant</h1>
<h2>Choose a chef:</h2>

<form th:action="@{/dishes}" method="get">
    <div th:each="chef : ${chefsList}">
        <input type="radio" th:name="chefId" th:value="${chef.id}" required/>
        <span th:text="${chef.firstName} + ' ' + ${chef.lastName} + ' ' + ${chef.getBio()}"></span>
        <br/>
    </div>
    <input type="submit" value="Select Chef"/>
</form>

</body>
</html>
