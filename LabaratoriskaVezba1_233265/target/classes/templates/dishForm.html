<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${dish.id != null} ? 'Edit Dish' : 'Add Dish'">Dish Form</title>
</head>
<body>
<h1 th:text="${dish.id != null} ? 'Edit Dish' : 'Add New Dish'">Dish Form</h1>

<form th:action="${dish.id != null} ? @{'/dishes/edit/' + ${dish.id}} : @{'/dishes/add'}" method="post">
    <label>Dish ID:</label>
    <input type="text" name="dishId" th:value="${dish.dishId}" required/><br/>

    <label>Name:</label>
    <input type="text" name="name" th:value="${dish.name}" required/><br/>

    <label>Cuisine:</label>
    <input type="text" name="cuisine" th:value="${dish.cuisine}" required/><br/>

    <label>Preparation Time (minutes):</label>
    <input type="number" name="preparationTime" th:value="${dish.preparationTime}" min="1" required/><br/>

    <button type="submit" th:text="${dish.id != null} ? 'Update Dish' : 'Add Dish'">Submit</button>
</form>

<a th:href="@{/dishes}">Back to Dish List</a>
</body>
</html>
