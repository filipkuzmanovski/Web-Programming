<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Dish</title>
</head>
<body>
<h1 th:text="'Select a dish for Chef ' + ${chef.firstName} + ' ' + ${chef.lastName}"></h1>

<form th:action="@{/servlet/chefDetails}" method="post">
    <div th:each="dish : ${allDishes}">
        <input type="radio" th:name="dishId" th:value="${dish.dishId}"/>
        <span th:text="${dish.name} + ' (' + ${dish.cuisine} + ', ' + ${dish.preperationTime} + ' min)'"></span>
        <br/>
    </div>
    <input type="hidden" th:name="chefId" th:value="${chef.id}"/>
    <input type="submit" value="Assign Dish"/>
</form>
</body>
</html>
