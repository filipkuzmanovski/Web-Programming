<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List of Dishes</title>
</head>
<body>
<h1>All Dishes</h1>

<a th:href="@{/dishes/dish-form}">Add New Dish</a>
<br/><br/>

<table border="1">
    <thead>
    <tr>
        <th>Dish ID</th>
        <th>Name</th>
        <th>Cuisine</th>
        <th>Preparation Time</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dish : ${dishes}">
        <td th:text="${dish.dishId}">Dish ID</td>
        <td th:text="${dish.name}">Name</td>
        <td th:text="${dish.cuisine}">Cuisine</td>
        <td th:text="${dish.preparationTime}">Time</td>
        <td>
            <a th:href="@{'/dishes/dish-form/' + ${dish.id}}">Edit</a>
            <form th:action="@{'/dishes/delete/' + ${dish.id}}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
