<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <title>Restaurant Chefs - Welcome to Our Restaurant</title>
    <style type="text/css">
    
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 2.5rem;
        }
        h2 {
            color: #7f8c8d;
            font-weight: 400;
            margin-bottom: 25px;
        }
        .chef-option {
            background: #fff;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
        }
        .chef-option:hover {
            border-color: #3498db;
            transform: translateY(-2px);
            background-color: #f0f7ff;
        }
        input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        label {
            cursor: pointer;
            font-size: 1.1rem;
            flex: 1;
        }
        input[type="submit"] {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            width: 100%;
            margin-top: 25px;
            transition: background 0.3s;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #27ae60;
        }
        .no-access {
            text-align: center;
            padding: 20px;
            background: #fff5f5;
            color: #c0392b;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Welcome to Our Restaurant</h1>
    </header>
    <main>
        <div sec:authorize="hasRole('ADMIN')">
            <h2>Choose a chef:</h2>
            <form action="/dishes" method="POST">
                <div th:each="chef: ${chefs}" class="chef-option">
                    <input type="radio"
                           name="chefId"
                           th:id="${'chef-' + chef.getId()}"
                           th:value="${chef.getId()}">
                    <label th:for="${'chef-' + chef.getId()}"
                           th:text="${chef.getFirstName()} + ' ' +  ${chef.getLastName()} + ' (' + ${chef.getBio()} + ')'">
                    </label>
                </div>
                <input type="submit" value="Submit Selection">
            </form>
        </div>

        <div sec:authorize="!hasRole('ADMIN')" class="no-access">
            <p>Please log in as an <strong>Administrator</strong> to select chefs and view dishes.</p>
        </div>
    </main>
</div>
</body>

</html>
