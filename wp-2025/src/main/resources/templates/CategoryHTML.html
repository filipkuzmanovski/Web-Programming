<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Category</title>
</head>
<body>
<h1>Welcome to the category website</h1>


<h3>Info about our request</h3><br>
<div>IP Adress: <th:block th:text="${ipAdress}"></th:block></div>
<div>Client Agent: <th:block th:text="${clientAgent}"></th:block></div>
<h3>Info about categories</h3>
<ul>
    <li th:each="category : ${Categories}"> <th:block th:text="${category.name}  ">  </th:block>   (<th:block th:text=" (${category.description})"></th:block>)</li>
</ul>
<form th:method="POST" th:action="@{/servlet/thymeleaf/category}">
    <label for='name'>Name: </label><input id="name" type="text" name="name">
    <label for="desc">Description: </label><input id="desc" type="text" name="desc">
    <input type="submit" value="submit">
</form>


</body>
</html>
